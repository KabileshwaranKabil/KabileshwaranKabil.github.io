<article class="dsa-card">
  <a class="dsa-card-link" href="{{ item.url | relative_url }}">
    <div class="dsa-card-meta">
      {% if item.leetcode_id %}<span class="dsa-badge">#{{ item.leetcode_id }}</span>{% endif %}
      {% if item.difficulty %}<span class="dsa-difficulty {{ item.difficulty | downcase }}">{{ item.difficulty }}</span>{% endif %}
    </div>
    <h3 class="dsa-card-title">{{ item.title }}</h3>
    {% if item.excerpt %}
      <p class="dsa-card-excerpt">{{ item.excerpt }}</p>
    {% endif %}
    <div class="dsa-card-tags">
      {% if item.language %}<span class="tag">{{ item.language }}</span>{% endif %}
      {% for tag in item.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
  </a>
</article>
