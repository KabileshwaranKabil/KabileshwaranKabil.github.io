<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ site.title | escape }}">
<meta name="application-name" content="{{ site.title | escape }}">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{%- seo -%}
<!-- Basic security and SEO headers -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://utteranc.es; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*; frame-src https://www.youtube.com https://utteranc.es; connect-src 'self' https://www.google-analytics.com https://utteranc.es;">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="robots" content="index, follow">

<!-- Open Graph / Social preview -->
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:image" content="{{ '/assets/images/profile.png' | absolute_url }}">
<meta property="og:type" content="website">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ site.github.username }}">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ '/assets/images/profile.png' | absolute_url }}">

<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

<!-- JSON-LD structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.title | escape }}",
  "url": "{{ site.url | default: site.github.url | absolute_url }}"
}
</script>
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/app-icon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/profile.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
<script defer src="{{ '/assets/js/app.js' | relative_url }}"></script>
{%- feed_meta -%}
{%- if jekyll.environment == 'production' and site.google_analytics -%}
  {%- include google-analytics.html -%}
{%- endif -%}

<script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = savedTheme || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
