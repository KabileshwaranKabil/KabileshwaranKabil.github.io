<article class="project-card">
  <a href="{{ include.url }}" class="project-link" target="_blank" rel="noopener noreferrer">
    <div class="project-body">
      <div class="project-meta-row">
        <span class="project-type">{{ include.type | default: "Project" }}</span>
        {% if include.featured %}<span class="project-featured">Featured</span>{% endif %}
      </div>
      <h3 class="project-title">{{ include.title }}</h3>
      <p class="project-description">{{ include.description }}</p>
      {% if include.stack %}
      <ul class="project-tags" aria-label="Project stack">
        {% for item in include.stack %}
          <li>{{ item }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>
  </a>
</article>
