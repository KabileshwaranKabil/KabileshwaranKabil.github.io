<article class="project-card">
  <a href="{{ include.url }}" class="project-link">
    <div class="project-image" style="background-image: url('{{ include.image | default: '/assets/images/project-placeholder.png' }}')"></div>
    <div class="project-body">
      <h3 class="project-title">{{ include.title }}</h3>
      <p class="project-description">{{ include.description }}</p>
      {% if include.tags %}
      <p class="project-tags">{{ include.tags }}</p>
      {% endif %}
    </div>
  </a>
</article>
