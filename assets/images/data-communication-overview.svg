<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Data communication overview</title>
  <desc id="desc">A sender creates a message, sends it through a network, and a receiver gets the message.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="#0f172a"/>
  <rect x="25" y="25" width="850" height="250" rx="14" fill="url(#panel)"/>
  <g font-family="Arial, sans-serif" fill="#f8fafc" text-anchor="middle">
    <rect x="65" y="95" width="170" height="100" rx="12" fill="#2563eb"/>
    <text x="150" y="135" font-size="22" font-weight="bold">Sender</text>
    <text x="150" y="164" font-size="16">creates data</text>
    <rect x="365" y="75" width="170" height="140" rx="12" fill="#334155"/>
    <circle cx="415" cy="125" r="12" fill="#fbbf24"/>
    <circle cx="450" cy="125" r="12" fill="#fbbf24"/>
    <circle cx="485" cy="125" r="12" fill="#fbbf24"/>
    <text x="450" y="170" font-size="21" font-weight="bold">Network</text>
    <text x="450" y="195" font-size="15">protocols + packets</text>
    <rect x="665" y="95" width="170" height="100" rx="12" fill="#059669"/>
    <text x="750" y="135" font-size="22" font-weight="bold">Receiver</text>
    <text x="750" y="164" font-size="16">uses data</text>
    <text x="450" y="52" font-size="17" fill="#fde68a">transmission medium</text>
  </g>
  <path d="M235 145 H355" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M545 145 H655" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="450" y="252" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Both sides follow agreed rules called protocols.</text>
</svg>
