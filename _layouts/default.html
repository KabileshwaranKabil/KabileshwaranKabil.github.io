<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body class="site-page" data-base-url="{{ '/' | relative_url }}" data-sw-url="{{ '/sw.js' | relative_url }}">
    <div class="site-shell">
    {%- include header.html -%}

    <main id="main-content" class="page-content" role="main" aria-label="Content">
      <div class="wrapper app-content-wrap">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    </div>
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  </body>
</html>
