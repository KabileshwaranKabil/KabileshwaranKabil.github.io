name: Sync DSA Solutions

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dsa-sync]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DSA repo
        uses: actions/checkout@v4
        with:
          repository: KabileshwaranKabil/dsa-learning-lab
          path: dsa_src
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Run DSA sync script
        run: python scripts/sync_dsa.py --src dsa_src --dest _dsa

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _dsa || true
          git diff --staged --quiet || (
            git commit -m "chore: sync DSA solutions from dsa-learning-lab"
            git push origin HEAD:${{ github.ref_name }}
          )
