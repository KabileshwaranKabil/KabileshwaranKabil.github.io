# The Site Configuration

theme: minima

# Disable minima's built-in theming to use our custom dark mode
minima:
  skin: null

lang: en

timezone: Asia/Kolkata

title: Kabileshwaran | Learning in Public

author: Kabileshwaran

logo: /assets/images/logo.svg

image: /assets/images/profile.png

tagline: Daily learnings, technical notes, and reflections from my CS journey

description: >-
  A public record of daily learnings, DSA practice, technical notes, and core Computer Science concepts as a Computer Science undergraduate.

url: "https://kabileshwarankabil.github.io"

github:
  username: KabileshwaranKabil

repository: KabileshwaranKabil/KabileshwaranKabil.github.io

social:
  name: Kabileshwaran
  email: kabileshwaran1896@gmail.com
  links:
    - https://github.com/KabileshwaranKabil
    - https://www.linkedin.com/in/m-kabileshwaran-4018a5378/

twitter:
  username: Kabileshwaran
  card: summary_large_image

paginate: 10

baseurl: ""

comments:
  provider: utterances
  utterances:
    repo: KabileshwaranKabil/KabileshwaranKabil.github.io
    issue_term: pathname
    theme: github-light
    label: comments

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Collection for DSA / LeetCode solutions
collections:
  dsa:
    output: true
    permalink: /dsa/:path/

markdown: kramdown

# Syntax highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
      start_line: 1

# 404 Page Configuration
404_error_page: 404.md

# Exclude files from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  

# Include dotfiles
include:
  - .htaccess


defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      comments: true
